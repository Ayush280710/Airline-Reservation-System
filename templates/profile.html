<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Horizon Airlines</title>

    <link rel="icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

<div class="login-container">

    <div class="login-card">

        <img src="{{ url_for('static', filename='images/logo3.png') }}" alt="Logo">

        <h1>My Profile</h1>

        <p>Welcome to Horizon Airlines.</p>

        <div class="input-box">
            <input type="text" value="Name : Demo User" readonly>
        </div>

        <div class="input-box">
            <input type="email" value="Email : demo@gmail.com" readonly>
        </div>

        <div class="input-box">
            <input type="text" value="Total Bookings : 0" readonly>
        </div>

        <a href="{{ url_for('booking') }}">
            <button>Book Flight</button>
        </a>

        <br><br>

        <a class="home-link" href="{{ url_for('home') }}">
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
