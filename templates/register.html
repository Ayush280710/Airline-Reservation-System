<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}"><title>Register | Horizon Airlines</title><link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}"></head><body><div class="login-container"><div class="login-card"><img src="{{ url_for('static', filename='images/logo3.png') }}"><h1>Create Account</h1><p>Join Horizon Airlines.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,msg in messages %}<div class="flash {{ category }}">{{ msg }}</div>{% endfor %}{% endwith %}<form method="POST"><div class="input-box"><input type="text" name="name" placeholder="Full Name" required></div><div class="input-box"><input type="email" name="email" placeholder="Email Address" required></div><div class="input-box"><input type="password" name="password" placeholder="Create Password" minlength="8" pattern="(?=.*[A-Z])(?=(?:.*\d){3,})(?=.*[^A-Za-z0-9]).{8,}" title="At least 8 characters, 3 numbers, 1 uppercase letter and 1 special character" required></div><div class="password-hint">Password: 8+ characters · 3 numbers · 1 uppercase · 1 special character</div><button>Create Account</button></form><a class="register-link" href="{{ url_for('login') }}">Already have an account? Login</a><a class="home-link" href="{{ url_for('home') }}">Back to Home</a></div></div></body></html>
